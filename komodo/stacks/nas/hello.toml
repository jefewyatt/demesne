# Stack: hello  →  server: nas
# Generated by scripts/new_service.py; edit freely, then run scripts/validate.py.

[[stack]]
name = "hello"
description = "Pipeline smoke test: tiny HTTP service built from source on the NAS"
tags = ["git", "nas", "redeploy-always"]

[stack.config]
server = "nas"
git_provider = "192.168.1.96:3000"
git_https = false
git_account = "komodo"
repo = "jeff/homelab"
branch = "main"
run_directory = "hosts/nas/hello"
file_paths = ["compose.yaml"]
# Built from source: build on deploy, never try to `compose pull` our own image.
run_build = true
auto_pull = false
# Written to .env next to compose.yaml. Secrets go here as [[KOMODO_SECRET_NAME]],
# never as literal values.
environment = """
APPDATA = /tank/appdata/hello
"""
