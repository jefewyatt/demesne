# Stack: immich  →  server: nas
# Generated by scripts/new_service.py; edit freely, then run scripts/validate.py.

[[stack]]
name = "immich"
description = "Immich v3.2.2 photo library on the NAS"
tags = ["git", "nas", "redeploy-if-changed"]

[stack.config]
server = "nas"
git_provider = "192.168.1.96:3000"
git_https = false
git_account = "komodo"
repo = "jeff/homelab"
branch = "main"
run_directory = "hosts/nas/immich"
file_paths = ["compose.yaml"]
# Written to .env next to compose.yaml. Secrets go here as [[KOMODO_SECRET_NAME]],
# never as literal values.
# Do not set DB_SKIP_MIGRATIONS. The database already has Immich's schema.
environment = """
APPDATA = /tank/appdata/immich
UPLOAD_LOCATION = /tank/immich/library
DB_DATA_LOCATION = /var/lib/immich/postgres
TZ = America/Los_Angeles
DB_USERNAME = postgres
DB_DATABASE_NAME = immich
DB_PASSWORD = [[IMMICH_DB_PASSWORD]]
"""
