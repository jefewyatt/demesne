# The one procedure the Forgejo webhook calls on every push to main.
#
# Webhook URL (set in Forgejo → repo → Settings → Webhooks):
#   http://<NAS_IP>:9120/listener/github/procedure/deploy-on-push/main
#
# Stage 1 applies everything under komodo/ (new/changed/removed stacks).
# Stage 2 deploys. Two strategies, chosen per stack by tag:
#   redeploy-if-changed  Komodo diffs the compose file (+ any config_files)
#                        against what's deployed and only redeploys on change.
#                        Right for stacks that only use pinned prebuilt images.
#   redeploy-always      Always runs `docker compose up` (with --build when
#                        run_build = true). Required for stacks that build
#                        from source, because Komodo's diff can't see changes
#                        to source code. Cheap when nothing changed: the build
#                        is fully cached and compose leaves containers alone.
#
# Agents: do not edit this file unless Jeff explicitly asks.

[[procedure]]
name = "deploy-on-push"
description = "Webhook target: sync komodo/*.toml from git, then deploy stacks"
tags = ["git"]

[[procedure.config.stage]]
name = "Sync resources from git"
executions = [
  { execution.type = "RunSync", execution.params.sync = "homelab" },
]

[[procedure.config.stage]]
name = "Deploy stacks"
executions = [
  { execution.type = "BatchDeployStackIfChanged", execution.params.pattern = "*", execution.params.tags = ["redeploy-if-changed"] },
  { execution.type = "BatchDeployStack", execution.params.pattern = "*", execution.params.tags = ["redeploy-always"] },
]
