# hello: pipeline smoke test, built from source on the NAS.
# Edit app/main.py, merge to main, and the new version should be live
# at http://192.168.1.96:8100 within a minute or so.

services:
  hello:
    build: .
    image: homelab/hello:local
    restart: unless-stopped
    ports:
      - "8100:8080"
    environment:
      GREETING: "hello from the nas"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
